name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Run browser-independent tests
        run: npm run test:run -- --exclude src/test/julia-renderer-evidence-v2.test.ts
      - name: Verify formula publication isolation
        run: npm run formula:rights:verify
      - run: npm run build
      - name: Verify built formula publication isolation
        run: npm run formula:rights:verify-build
