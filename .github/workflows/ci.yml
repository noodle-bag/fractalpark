name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Julia worker audit
        run: npx playwright install chromium
      - run: npm run lint
      - run: npm run test:run
      - run: npm run formula:performance:verify
      - name: Verify formula publication isolation
        run: npm run formula:rights:verify
      - run: npm run build
      - name: Verify built formula publication isolation
        run: npm run formula:rights:verify-build
      - run: npm run formula:performance:verify-build
