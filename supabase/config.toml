# FractalPark local Supabase stack (v0.4.15 web creation loop).
# Only the local development stack is configured here. Staging and
# production projects are provisioned outside the repository and share the
# same migrations/RLS/bucket contracts; they never share credentials.
project_id = "fractalpark"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
# Local email capture for OTP testing; no real email leaves the local stack.
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# Local OTP codes are readable through Mailpit; no SMTP is configured here.

# Passwordless sign-in uses a six-digit code (spec section 3), so the
# magic-link template renders {{ .Token }} instead of a link. The staging
# project carries the same template (set through the Management API).
[auth.email.template.magic_link]
subject = "Your FractalPark sign-in code"
content_path = "./supabase/templates/magic-link.html"
